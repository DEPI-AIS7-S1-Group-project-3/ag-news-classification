<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG Wire — Classification Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="console">

    <header class="masthead">
      <div class="masthead-title">
        <span class="masthead-icon" aria-hidden="true">📡</span>
        <h1>AG Wire</h1>
      </div>
      <p class="masthead-sub">A console for testing where the model routes a piece of text.</p>
    </header>

    <div class="grid">
      <div class="col">
        <section class="panel" aria-label="Routing desks">
          <ul class="lamps" id="lamps">
            <li class="lamp" data-desk="World">
              <span class="bulb"></span>
              <span class="lamp-label">World</span>
            </li>
            <li class="lamp" data-desk="Sports">
              <span class="bulb"></span>
              <span class="lamp-label">Sports</span>
            </li>
            <li class="lamp" data-desk="Business">
              <span class="bulb"></span>
              <span class="lamp-label">Business</span>
            </li>
            <li class="lamp" data-desk="Sci/Tech">
              <span class="bulb"></span>
              <span class="lamp-label">Sci/Tech</span>
            </li>
          </ul>
        </section>

        <section class="panel input-panel">
          <label for="text">Text to classify</label>
          <textarea id="text" placeholder="Paste a headline or article, e.g. “Apple reveals new M-series chips in latest event.”"></textarea>
          <div class="input-row">
            <span class="counter" id="counter">0 characters</span>
            <button id="send" type="button">Classify</button>
          </div>
        </section>

        <p class="error" id="error" role="alert"></p>
      </div>

      <div class="col">
        <section class="panel readout" id="result" aria-live="polite">
          <div class="readout-top">
            <span class="readout-label">Category</span>
            <span class="readout-time" id="timing"></span>
          </div>
          <p class="readout-category idle" id="category">Awaiting input</p>

          <div class="signal">
            <span class="signal-label">Signal</span>
            <div class="signal-meter" id="signalMeter"></div>
            <span class="signal-value" id="signalValue">—</span>
          </div>

          <p class="readout-flag" id="flag">Nothing classified yet.</p>
        </section>

        <section class="panel log" id="log">
          <h2>Recent dispatches</h2>
          <ol id="logItems"></ol>
          <p class="log-empty" id="logEmpty">Nothing sent yet — dispatches will appear here.</p>
        </section>
      </div>
    </div>

    <footer class="config">
      <label for="apiUrl">API endpoint</label>
      <input id="apiUrl" type="text" value="http://localhost:8123/api/v1/predict" spellcheck="false">
    </footer>

  </main>

<script src="script.js"></script>
</body>
</html>
