<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG Wire — News Desk Classifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #edeade;
    --paper-shade: #e2ded0;
    --ink: #201f1a;
    --ink-soft: #565248;
    --rule: #c9c3b0;
    --world: #2b4570;
    --sports: #3f6b4c;
    --business: #a3671f;
    --scitech: #5b4b8a;
    --alert: #a13d3d;
    --paper-rgb: 237, 234, 222;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top left, rgba(0,0,0,0.03), transparent 60%);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .sheet {
    width: 100%;
    max-width: 640px;
  }

  .masthead {
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .masthead h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .masthead .edition {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .subhead {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 10px 0 26px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 26px;
  }

  .desks {
    display: flex;
    gap: 0;
    border: 1px solid var(--rule);
    margin-bottom: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
  }

  .desk {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    color: var(--ink-soft);
    border-right: 1px solid var(--rule);
    position: relative;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .desk:last-child { border-right: none; }

  .desk .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-inline-end: 6px;
    background: var(--ink-soft);
    opacity: 0.35;
  }

  .desk.active { background: rgba(0,0,0,0.04); color: var(--ink); font-weight: 600; }
  .desk.active .dot { opacity: 1; }
  .desk[data-desk="World"].active .dot { background: var(--world); }
  .desk[data-desk="Sports"].active .dot { background: var(--sports); }
  .desk[data-desk="Business"].active .dot { background: var(--business); }
  .desk[data-desk="Sci/Tech"].active .dot { background: var(--scitech); }

  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    background: var(--paper-shade);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 14px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }
  textarea:focus { border-color: var(--ink-soft); }
  textarea::placeholder { color: #96907e; font-style: italic; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .counter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 11px 22px;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover:not(:disabled) { background: #3a3830; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }

  .result {
    margin-top: 30px;
    border-top: 1px dashed var(--rule);
    padding-top: 22px;
    display: none;
  }
  .result.show { display: block; animation: reveal 0.35s ease; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .result-head .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .category {
    font-size: 26px;
    font-weight: 700;
    margin: 2px 0 14px;
  }
  .category[data-cat="World"] { color: var(--world); }
  .category[data-cat="Sports"] { color: var(--sports); }
  .category[data-cat="Business"] { color: var(--business); }
  .category[data-cat="Sci/Tech"] { color: var(--scitech); }

  .meter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .meter {
    flex: 1;
    height: 8px;
    background: var(--paper-shade);
    border: 1px solid var(--rule);
    border-radius: 1px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: var(--ink);
    transition: width 0.5s ease;
  }
  .category[data-cat="World"] ~ .meter-row .meter-fill,
  .meter-fill.World { background: var(--world); }
  .meter-fill.Sports { background: var(--sports); }
  .meter-fill.Business { background: var(--business); }
  .meter-fill.Sci\/Tech { background: var(--scitech); }

  .meter-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    min-width: 40px;
    text-align: right;
  }

  .flag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    display: inline-block;
    padding: 3px 8px;
    border-radius: 2px;
    margin-top: 4px;
  }
  .flag.ok { color: var(--ink-soft); }
  .flag.fallback { color: var(--alert); background: rgba(161,61,61,0.08); }

  .error {
    margin-top: 30px;
    border: 1px solid var(--alert);
    background: rgba(161,61,61,0.06);
    color: var(--alert);
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    display: none;
    border-radius: 2px;
  }
  .error.show { display: block; }

  .log {
    margin-top: 40px;
  }
  .log-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .log-item {
    display: flex;
    gap: 14px;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 14px;
  }
  .log-item .l-cat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    min-width: 68px;
    flex-shrink: 0;
  }
  .log-item .l-cat.World { color: var(--world); }
  .log-item .l-cat.Sports { color: var(--sports); }
  .log-item .l-cat.Business { color: var(--business); }
  .log-item .l-cat.Sci\/Tech { color: var(--scitech); }
  .log-item .l-text {
    color: var(--ink-soft);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-item .l-conf {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .config {
    margin-top: 46px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: #96907e;
    text-align: center;
  }
  .config input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    background: none;
    border: none;
    border-bottom: 1px dotted var(--rule);
    color: var(--ink-soft);
    width: 220px;
    text-align: center;
  }
  .config input:focus { outline: none; border-bottom-color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="masthead">
      <h1>AG&nbsp;Wire</h1>
      <div class="edition">NEWS DESK<br>CLASSIFIER</div>
    </div>
    <div class="subhead">paste a headline or article below — it will be routed to one of four desks</div>

    <div class="desks" id="desks">
      <div class="desk" data-desk="World"><span class="dot"></span>World</div>
      <div class="desk" data-desk="Sports"><span class="dot"></span>Sports</div>
      <div class="desk" data-desk="Business"><span class="dot"></span>Business</div>
      <div class="desk" data-desk="Sci/Tech"><span class="dot"></span>Sci/Tech</div>
    </div>

    <label for="text">article text</label>
    <textarea id="text" placeholder="e.g. Apple reveals new M-series chips in latest event."></textarea>
    <div class="row">
      <span class="counter" id="counter">0 characters</span>
      <button id="send">Send to desk ▸</button>
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-head">
        <span class="label">routed to</span>
        <span class="label" id="timing"></span>
      </div>
      <div class="category" id="category" data-cat="">—</div>
      <div class="meter-row">
        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        <span class="meter-value" id="meterValue">0%</span>
      </div>
      <span class="flag" id="flag"></span>
    </div>

    <div class="log" id="log" style="display:none">
      <div class="log-title">recent dispatches</div>
      <div id="logItems"></div>
    </div>

    <div class="config">
      API endpoint: <input id="apiUrl" value="http://localhost:8000/api/v1/predict">
    </div>
  </div>

<script>
  const textEl = document.getElementById('text');
  const counterEl = document.getElementById('counter');
  const sendBtn = document.getElementById('send');
  const resultEl = document.getElementById('result');
  const errorEl = document.getElementById('error');
  const categoryEl = document.getElementById('category');
  const meterFillEl = document.getElementById('meterFill');
  const meterValueEl = document.getElementById('meterValue');
  const flagEl = document.getElementById('flag');
  const timingEl = document.getElementById('timing');
  const desksEl = document.getElementById('desks');
  const apiUrlEl = document.getElementById('apiUrl');
  const logEl = document.getElementById('log');
  const logItemsEl = document.getElementById('logItems');

  const history = [];

  textEl.addEventListener('input', () => {
    counterEl.textContent = `${textEl.value.length} characters`;
  });

  function setDesk(category) {
    [...desksEl.children].forEach(d => {
      d.classList.toggle('active', d.dataset.desk === category);
    });
  }

  function addToLog(text, category, confidence) {
    history.unshift({ text, category, confidence });
    if (history.length > 5) history.pop();
    logEl.style.display = 'block';
    logItemsEl.innerHTML = history.map(h => `
      <div class="log-item">
        <span class="l-cat ${h.category.replace('/', '\\/')}">${h.category}</span>
        <span class="l-text">${escapeHtml(h.text)}</span>
        <span class="l-conf">${(h.confidence * 100).toFixed(0)}%</span>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function classify() {
    const text = textEl.value.trim();
    if (!text) {
      textEl.focus();
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = 'Routing…';
    errorEl.classList.remove('show');
    resultEl.classList.remove('show');

    const started = performance.now();

    try {
      const response = await fetch(apiUrlEl.value, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      if (!response.ok) {
        const body = await response.text();
        throw new Error(`HTTP ${response.status} — ${body.slice(0, 160)}`);
      }

      const data = await response.json();
      const elapsed = ((performance.now() - started) / 1000).toFixed(2);

      categoryEl.textContent = data.category;
      categoryEl.dataset.cat = data.category;

      const confidence = data.confidence ?? 0;
      meterValueEl.textContent = `${Math.round(confidence * 100)}%`;
      meterFillEl.className = 'meter-fill ' + data.category.replace('/', '\\/');
      requestAnimationFrame(() => { meterFillEl.style.width = `${confidence * 100}%`; });

      if (data.used_fallback) {
        flagEl.textContent = 'fallback used — model unavailable, keyword match only';
        flagEl.className = 'flag fallback';
      } else {
        flagEl.textContent = 'routed via model — no fallback';
        flagEl.className = 'flag ok';
      }

      timingEl.textContent = `${elapsed}s`;
      setDesk(data.category);
      resultEl.classList.add('show');
      addToLog(text, data.category, confidence);

    } catch (err) {
      errorEl.textContent = `Could not reach the desk — ${err.message}`;
      errorEl.classList.add('show');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to desk ▸';
    }
  }

  sendBtn.addEventListener('click', classify);
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) classify();
  });
</script>
</body>
</html>
